<ion-content>
    <div class="preloader-panel left" #leftPanel></div>
    <div class="preloader-panel right" #rightPanel></div>
    <div class="counter" #counter>{{ percentageCounter() }}<span>%</span></div>
 
    <div class="content">
      <div>
        <h1 #heading>Your headline goes <span class="accent">here</span></h1>
        <p #paragraph>
          Content sits underneath the loader the whole time — the panels
          just slide away to reveal it.
        </p>
      </div>
    </div>

</ion-content>
